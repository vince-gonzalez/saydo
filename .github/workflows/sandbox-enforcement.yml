# Prove, on real Linux, that SayDo's container sandbox ENFORCES rather than
# observes.
#
# SANDBOX.md records a measured gap: on a host, a client that ignores proxy
# configuration -- Node's built-in fetch does exactly this -- escapes
# observation entirely. The claim is that a container whose only route out is
# the SayDo proxy closes that gap without needing the tool's cooperation.
#
# This workflow tests that claim instead of asserting it. It is the
# verify-the-verifier discipline applied to the sandbox: every case must come
# out the stated way, and the job fails loudly if any of them does not.
#
#   A  non-cooperative client (Node fetch, NO proxy config)  -> BLOCKED
#      This is the exact case that succeeds on a host. It must fail here.
#   B  cooperative client -> allowlisted host                -> ALLOWED
#   C  cooperative client -> host outside the allowlist      -> REFUSED (403)
#
# A alone is the point: enforcement does not depend on the tool being polite.

name: sandbox enforcement

on:
  push:
    paths:
      - 'container/**'
      - 'tools/**'
      - 'seeded/**'
      - '.github/workflows/sandbox-enforcement.yml'
  workflow_dispatch:

jobs:
  enforcement:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Environment
        run: |
          uname -a
          docker --version
          docker info --format 'server: {{.ServerVersion}}'

      - name: Build the proxy image
        run: docker build -f container/Dockerfile.proxy -t saydo/proxy:ci .

      - name: Create the two networks
        run: |
          # saydo-inside has NO route off-host: a container on it can reach
          # only its neighbours. saydo-outside is a normal bridge, and only
          # the proxy is attached to it. That asymmetry is the enforcement.
          docker network create --internal saydo-inside
          docker network create saydo-outside
          docker network inspect saydo-inside  --format 'inside  internal={{.Internal}}'
          docker network inspect saydo-outside --format 'outside internal={{.Internal}}'

      - name: Start the proxy on both networks, allowlisting example.com only
        run: |
          docker run -d --name saydo-proxy \
            --network saydo-inside --network-alias saydo-proxy \
            -e SAYDO_ALLOW=example.com \
            saydo/proxy:ci
          docker network connect saydo-outside saydo-proxy
          sleep 3
          docker logs saydo-proxy

      - name: Pull test images before isolation matters
        run: |
          docker pull node:22-slim
          docker pull python:3.12-slim

      # ------------------------------------------------------------------
      # A. The case that escapes on a host. Node's fetch ignores proxy env,
      #    so nothing here is cooperating. On the host this reaches the
      #    internet; inside saydo-inside there is no route, so it must fail.
      # ------------------------------------------------------------------
      - name: 'A: non-cooperative client must be BLOCKED'
        run: |
          set +e
          OUT=$(docker run --rm --network saydo-inside node:22-slim \
            node -e "fetch('https://example.com/').then(r=>{console.log('REACHED '+r.status)}).catch(e=>{console.log('BLOCKED '+e.cause)})" 2>&1)
          set -e
          echo "$OUT"
          if echo "$OUT" | grep -q "REACHED"; then
            echo "::error::ENFORCEMENT FAILED - a non-cooperative client reached the internet from inside the sandbox"
            exit 1
          fi
          echo "OK: the client that escapes on a host could not get out here."

      # ------------------------------------------------------------------
      # B and C. A cooperative client, to show the proxy is a working route
      #    and that the allowlist is a policy rather than a report.
      # ------------------------------------------------------------------
      - name: 'B: allowlisted host through the proxy must be ALLOWED'
        run: |
          set +e
          OUT=$(docker run --rm --network saydo-inside \
            -e HTTPS_PROXY=http://saydo-proxy:8888 \
            python:3.12-slim \
            python -c "import urllib.request;print('STATUS', urllib.request.urlopen('https://example.com/', timeout=25).status)" 2>&1)
          set -e
          echo "$OUT"
          echo "$OUT" | grep -q "STATUS 200" || {
            echo "::error::allowlisted host did not get through the proxy"; exit 1; }
          echo "OK: allowlisted egress works through the proxy."

      - name: 'C: non-allowlisted host must be REFUSED by the proxy'
        run: |
          set +e
          OUT=$(docker run --rm --network saydo-inside \
            -e HTTPS_PROXY=http://saydo-proxy:8888 \
            python:3.12-slim \
            python -c "import urllib.request;print('REACHED', urllib.request.urlopen('https://example.org/', timeout=25).status)" 2>&1)
          set -e
          echo "$OUT"
          if echo "$OUT" | grep -q "REACHED"; then
            echo "::error::a host outside the allowlist was NOT refused"; exit 1; fi
          echo "$OUT" | grep -qi "403" || {
            echo "::error::refusal did not come from the proxy as a 403"; exit 1; }
          echo "OK: non-allowlisted egress refused by the proxy."

      - name: Proxy decision log (the evidence)
        if: always()
        run: |
          echo "--- every decision the proxy made ---"
          docker logs saydo-proxy

      - name: Tear down the primitive test
        if: always()
        run: |
          docker rm -f saydo-proxy || true
          docker network rm saydo-inside saydo-outside || true

  # --------------------------------------------------------------------
  # A full conformance run INSIDE the sandbox, on the seeded liar.
  # Two things must be true at once: the harness still catches the tool
  # breaking its declaration, and the sandbox stops it from succeeding.
  # Only a run like this may produce a receipt that says "contained".
  # --------------------------------------------------------------------
  contained-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install harness dependencies
        run: pip install --quiet jsonschema cryptography "mcp==1.29.1"

      - name: Build the proxy and the seeded-server images
        run: |
          docker build -f container/Dockerfile.proxy  -t saydo/proxy:ci .
          docker build -f container/Dockerfile.seeded -t saydo/seeded:ci .

      - name: Run conformance with the CONTAINER runner
        run: |
          python tools/harness.py \
            seeded/malserver.declaration.json \
            captured/malserver.json \
            /tmp/malserver.report.json \
            --python python \
            --plan malserver \
            --runner container \
            --image saydo/seeded:ci

      - name: The run must be contained AND must still catch the liar
        run: |
          python - <<'PY'
          import json, sys
          r = json.load(open('/tmp/malserver.report.json'))
          print('enforcement:', r['enforcement'])
          print('tally      :', r['tally'])
          for v in r['verdicts']:
              print('  {:<12} {:<22} {}'.format(v['verdict'], v['id'], v['evidence'][:90]))

          # These assertions were previously too weak: a server that failed to
          # start satisfied "not conformant" and ">=1 fail" and the job went
          # green while proving nothing. A dead server must fail this gate.
          by_id = {v['id']: v for v in r['verdicts']}
          problems = []
          if r['enforcement'] != 'contained':
              problems.append('run was not contained: ' + r['enforcement'])
          if r['conformant']:
              problems.append('the seeded liar was reported CONFORMANT - the harness failed')

          # The server must actually have served. Its refusal tool answering
          # is the cheapest proof that the session did real work.
          scope = by_id.get('refusal.scope', {})
          if scope.get('verdict') != 'pass':
              problems.append('the server did not serve: refusal.scope = '
                              + str(scope.get('verdict')) + ' :: '
                              + str(scope.get('evidence')))

          # "no call window" anywhere means tools were never exercised.
          dead = [v['id'] for v in r['verdicts']
                  if 'no call window' in (v.get('evidence') or '')]
          if dead:
              problems.append('tools were never exercised: ' + ', '.join(dead))

          # The seeded server breaks these on purpose. Under containment the
          # ATTEMPT must still be visible even though the boundary stops it.
          # network.none is the reason the DNS sink exists. The seeded server
          # opens a raw socket to a hostname; the sandbox stops it, but the
          # lookup is recorded, so the ATTEMPT must still refute the claim.
          # If this passes, silence is being mistaken for good behaviour again.
          for must_fail in ('network.none', 'writes.none', 'subprocess.none'):
              got = by_id.get(must_fail, {}).get('verdict')
              if got != 'fail':
                  problems.append(
                      '{} should have been refuted inside the sandbox, got {}'
                      .format(must_fail, got))

          # Bridge logging is what makes a bare-IP connection attributable.
          # This runner can install it, so if it silently did not, say so
          # rather than quietly losing the coverage.
          if 'Bridge logging is NOT active' in r['monitor']:
              problems.append('bridge logging failed to install: ' + r['monitor'][-160:])

          # The seeded server's beacon() connects to 192.0.2.1 with no name
          # lookup at all. The DNS sink cannot see that; only the bridge log
          # can. Its presence in the evidence is the proof that the bare-IP
          # case is covered rather than merely stopped.
          net_ev = by_id.get('network.none', {}).get('evidence', '')
          if '192.0.2.1' not in net_ev:
              problems.append(
                  'the bare-IP attempt (192.0.2.1) was not attributed; '
                  'evidence was: ' + net_ev[:200])
          if problems:
              for p in problems:
                  print('::error::' + p)
              sys.exit(1)
          print('OK: contained run, and the seeded server was still caught.')
          PY

      - name: Emit the receipt and check it earns the word "contained"
        run: |
          python tools/receipt.py /tmp/malserver.report.json \
            seeded/malserver.declaration.json captured/malserver.json /tmp/receipts \
            --at 2026-08-29T00:00:00Z
          python - <<'PY'
          import json
          rows = [json.loads(l) for l in open('/tmp/receipts/malserver.receipt.jsonl') if l.strip()]
          mon = next(r for r in rows if r['type'] == 'monitor')
          assert mon['enforcement'] == 'contained', mon['enforcement']
          print('receipt monitor row records enforcement =', mon['enforcement'])
          print(mon['does_not_observe'])
          PY

      - name: Tear down
        if: always()
        run: |
          docker rm -f $(docker ps -aq --filter "name=saydo-proxy") 2>/dev/null || true
          docker network prune -f || true
