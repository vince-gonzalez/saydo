# Prove, on real Linux, that SayDo's container sandbox ENFORCES rather than
# observes.
#
# SANDBOX.md records a measured gap: on a host, a client that ignores proxy
# configuration -- Node's built-in fetch does exactly this -- escapes
# observation entirely. The claim is that a container whose only route out is
# the SayDo proxy closes that gap without needing the tool's cooperation.
#
# This workflow tests that claim instead of asserting it. It is the
# verify-the-verifier discipline applied to the sandbox: every case must come
# out the stated way, and the job fails loudly if any of them does not.
#
#   A  non-cooperative client (Node fetch, NO proxy config)  -> BLOCKED
#      This is the exact case that succeeds on a host. It must fail here.
#   B  cooperative client -> allowlisted host                -> ALLOWED
#   C  cooperative client -> host outside the allowlist      -> REFUSED (403)
#
# A alone is the point: enforcement does not depend on the tool being polite.

name: sandbox enforcement

on:
  push:
    paths:
      - 'container/**'
      - 'tools/**'
      - 'seeded/**'
      - '.github/workflows/sandbox-enforcement.yml'
  workflow_dispatch:

# One run per branch at a time. Pushing three commits in five minutes
# used to start three full runs that all raced for the same runners --
# starving the corpus sweep, and mailing a failure for each superseded
# run as it was killed. Only the newest commit's result is meaningful,
# so the older ones are cancelled rather than finished.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  enforcement:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Environment
        run: |
          uname -a
          docker --version
          docker info --format 'server: {{.ServerVersion}}'

      - name: Build the proxy image
        run: docker build -f container/Dockerfile.proxy -t saydo/proxy:ci .

      - name: Create the two networks
        run: |
          # saydo-inside has NO route off-host: a container on it can reach
          # only its neighbours. saydo-outside is a normal bridge, and only
          # the proxy is attached to it. That asymmetry is the enforcement.
          docker network create --internal saydo-inside
          docker network create saydo-outside
          docker network inspect saydo-inside  --format 'inside  internal={{.Internal}}'
          docker network inspect saydo-outside --format 'outside internal={{.Internal}}'

      - name: Start the proxy on both networks, allowlisting example.com only
        run: |
          docker run -d --name saydo-proxy \
            --network saydo-inside --network-alias saydo-proxy \
            -e SAYDO_ALLOW=example.com \
            saydo/proxy:ci
          docker network connect saydo-outside saydo-proxy
          sleep 3
          docker logs saydo-proxy

      - name: Pull test images before isolation matters
        run: |
          docker pull node:22-slim
          docker pull python:3.12-slim

      # ------------------------------------------------------------------
      # A. The case that escapes on a host. Node's fetch ignores proxy env,
      #    so nothing here is cooperating. On the host this reaches the
      #    internet; inside saydo-inside there is no route, so it must fail.
      # ------------------------------------------------------------------
      - name: 'A: non-cooperative client must be BLOCKED'
        run: |
          set +e
          OUT=$(docker run --rm --network saydo-inside node:22-slim \
            node -e "fetch('https://example.com/').then(r=>{console.log('REACHED '+r.status)}).catch(e=>{console.log('BLOCKED '+e.cause)})" 2>&1)
          set -e
          echo "$OUT"
          if echo "$OUT" | grep -q "REACHED"; then
            echo "::error::ENFORCEMENT FAILED - a non-cooperative client reached the internet from inside the sandbox"
            exit 1
          fi
          echo "OK: the client that escapes on a host could not get out here."

      # ------------------------------------------------------------------
      # B and C. A cooperative client, to show the proxy is a working route
      #    and that the allowlist is a policy rather than a report.
      # ------------------------------------------------------------------
      - name: 'B: allowlisted host through the proxy must be ALLOWED'
        run: |
          set +e
          OUT=$(docker run --rm --network saydo-inside \
            -e HTTPS_PROXY=http://saydo-proxy:8888 \
            python:3.12-slim \
            python -c "import urllib.request;print('STATUS', urllib.request.urlopen('https://example.com/', timeout=25).status)" 2>&1)
          set -e
          echo "$OUT"
          echo "$OUT" | grep -q "STATUS 200" || {
            echo "::error::allowlisted host did not get through the proxy"; exit 1; }
          echo "OK: allowlisted egress works through the proxy."

      - name: 'C: non-allowlisted host must be REFUSED by the proxy'
        run: |
          set +e
          OUT=$(docker run --rm --network saydo-inside \
            -e HTTPS_PROXY=http://saydo-proxy:8888 \
            python:3.12-slim \
            python -c "import urllib.request;print('REACHED', urllib.request.urlopen('https://example.org/', timeout=25).status)" 2>&1)
          set -e
          echo "$OUT"
          if echo "$OUT" | grep -q "REACHED"; then
            echo "::error::a host outside the allowlist was NOT refused"; exit 1; fi
          echo "$OUT" | grep -qi "403" || {
            echo "::error::refusal did not come from the proxy as a 403"; exit 1; }
          echo "OK: non-allowlisted egress refused by the proxy."

      - name: Proxy decision log (the evidence)
        if: always()
        run: |
          echo "--- every decision the proxy made ---"
          docker logs saydo-proxy

      - name: Tear down the primitive test
        if: always()
        run: |
          docker rm -f saydo-proxy || true
          docker network rm saydo-inside saydo-outside || true

  # --------------------------------------------------------------------
  # A full conformance run INSIDE the sandbox, on the seeded liar.
  # Two things must be true at once: the harness still catches the tool
  # breaking its declaration, and the sandbox stops it from succeeding.
  # Only a run like this may produce a receipt that says "contained".
  # --------------------------------------------------------------------
  contained-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install harness dependencies
        run: pip install --quiet jsonschema cryptography "mcp==1.29.1"

      - name: Build the proxy and the seeded-server images
        run: |
          docker build -f container/Dockerfile.proxy  -t saydo/proxy:ci .
          docker build -f container/Dockerfile.seeded -t saydo/seeded:ci .

      # The sandbox MUST have a writable path, and this asserts it rather
      # than assuming it. It did not: the images run as an unprivileged user
      # and a tmpfs mounts root-owned 0755, so every directory including
      # /scratch refused, tempfile raised, and any server that touches a
      # temporary file died in its constructor -- while the harness recorded
      # the refused probes as the tool attempting writes and reported the
      # result as that tool's behaviour.
      #
      # It also prints the raw monitor stream, because reasoning about this
      # from the far end of the pipeline produced a confident wrong answer and
      # one run of this produced the right one.
      - name: 'GATE: the sandbox must be writable, and writes must be seen'
        run: |
          docker run --rm -i \
            --network none --read-only \
            --tmpfs /scratch:rw,noexec,nosuid,size=64m,mode=1777 \
            --tmpfs /home/saydo:rw,noexec,nosuid,size=32m,mode=1777 \
            -e HOME=/home/saydo -e TMPDIR=/scratch -e SAYDO_MONITOR_STDERR=1 \
            -e PYTHONDONTWRITEBYTECODE=1 --workdir /scratch \
            saydo/seeded:ci python -c '
          import os, sys, tempfile
          print("HOME       =", os.environ.get("HOME"))
          print("expanduser =", os.path.expanduser("~"))
          try:
              print("gettempdir =", tempfile.gettempdir())
          except Exception as e:
              print("NO WRITABLE TEMP DIR:", e); sys.exit(3)
          for path in (os.path.join(tempfile.gettempdir(), "probe_note.txt"),
                       os.path.join(os.path.expanduser("~"), ".probe-state")):
              try:
                  open(path, "w").write("x"); print("wrote", path)
              except OSError as e:
                  print("WRITE REFUSED:", path, e); sys.exit(4)
          ' 2>&1 | tee /tmp/sandbox-probe.txt | sed 's/^/    /'
          echo "--- above: every line prefixed @@SAYDO@@ is a monitor event ---"
          # tee returns ITS exit code, not the container's, so the outcome is
          # read from the output. A pipeline that always succeeds has masked a
          # failing check here before.
          if grep -qE "NO WRITABLE TEMP DIR|WRITE REFUSED" /tmp/sandbox-probe.txt; then
            echo "::error::the sandbox gave the tool nowhere to write. Every           server that touches a temporary file will die in its constructor and           be recorded under its own failures."
            exit 1
          fi
          grep -q "wrote /scratch/probe_note.txt" /tmp/sandbox-probe.txt || {
            echo "::error::the scratch write did not happen"; exit 1; }
          echo "OK: the sandbox has writable paths and they are observed."

      - name: Run conformance with the CONTAINER runner
        run: |
          python tools/harness.py \
            seeded/malserver.declaration.json \
            captured/malserver.json \
            /tmp/malserver.report.json \
            --python python \
            --plan malserver \
            --runner container \
            --image saydo/seeded:ci

      - name: The run must be contained AND must still catch the liar
        run: |
          python - <<'PY'
          import json, sys
          r = json.load(open('/tmp/malserver.report.json'))
          print('enforcement:', r['enforcement'])
          print('tally      :', r['tally'])
          for v in r['verdicts']:
              print('  {:<12} {:<22} {}'.format(v['verdict'], v['id'], v['evidence'][:90]))

          # These assertions were previously too weak: a server that failed to
          # start satisfied "not conformant" and ">=1 fail" and the job went
          # green while proving nothing. A dead server must fail this gate.
          by_id = {v['id']: v for v in r['verdicts']}
          problems = []
          if r['enforcement'] != 'contained':
              problems.append('run was not contained: ' + r['enforcement'])
          if r['conformant']:
              problems.append('the seeded liar was reported CONFORMANT - the harness failed')

          # The server must actually have served. Its refusal tool answering
          # is the cheapest proof that the session did real work.
          scope = by_id.get('refusal.scope', {})
          if scope.get('verdict') != 'pass':
              problems.append('the server did not serve: refusal.scope = '
                              + str(scope.get('verdict')) + ' :: '
                              + str(scope.get('evidence')))

          # "no call window" anywhere means tools were never exercised.
          dead = [v['id'] for v in r['verdicts']
                  if 'no call window' in (v.get('evidence') or '')]
          if dead:
              problems.append('tools were never exercised: ' + ', '.join(dead))

          # The seeded server breaks these on purpose. Under containment the
          # ATTEMPT must still be visible even though the boundary stops it.
          # network.none is the reason the DNS sink exists. The seeded server
          # opens a raw socket to a hostname; the sandbox stops it, but the
          # lookup is recorded, so the ATTEMPT must still refute the claim.
          # If this passes, silence is being mistaken for good behaviour again.
          for must_fail in ('network.none', 'writes.none', 'subprocess.none'):
              got = by_id.get(must_fail, {}).get('verdict')
              if got != 'fail':
                  problems.append(
                      '{} should have been refuted inside the sandbox, got {}'
                      .format(must_fail, got))

          # The seeded server's beacon() connects to 192.0.2.1 with no name
          # lookup at all, so the resolver cannot record it. Naming that
          # address in the evidence is the proof that the bare-IP case is
          # attributed rather than merely stopped.
          # The sandbox gives the tool a writable, ephemeral home, because a
          # read-only one kills servers in their constructor and measures
          # nothing. That concession is only acceptable while the home stays
          # WATCHED: the seeded server writes into it on purpose, and that
          # write must appear in the evidence. If it stops appearing, the
          # sandbox has quietly become somewhere a tool can act unobserved.
          # Checked against `observed`, the complete record, not against
          # `evidence`, which is a six-item human summary. Asserting on the
          # prose is how this gate first reported a write as unobserved that
          # the harness had observed perfectly well.
          writes = by_id.get('writes.none', {}).get('observed', [])
          print('writes observed ({}):'.format(len(writes)))
          for w in writes:
              print('   {}: {}'.format(w['tool'], w['detail']))
          if not any('.malserver-state' in w['detail'] for w in writes):
              problems.append(
                  'a write into the sandbox home was not observed; allowing '
                  'that write is only safe while it is still reported. '
                  '{} writes were recorded.'.format(len(writes)))
          # A test that quietly does not run looks exactly like a test that
          # passed. Print what the fixture reported so a future failure says
          # which of the two happened.
          print('home write seen:',
                [w for w in writes if 'malserver-state' in w['detail']] or 'NONE')

          net_ev = by_id.get('network.none', {}).get('evidence', '')
          if '192.0.2.1' not in net_ev:
              problems.append(
                  'the bare-IP attempt (192.0.2.1) was not attributed; '
                  'evidence was: ' + net_ev[:200])
          if problems:
              for p in problems:
                  print('::error::' + p)
              sys.exit(1)
          print('OK: contained run, and the seeded server was still caught.')
          PY

      # The counterfactual, under enforcement, which is where it had never
      # been tested. Locally the allowlist is off and every request is
      # forwarded, so the body gets examined on the way through; contained,
      # the proxy refuses at CONNECT and used to see nothing at all. That is
      # why data.stays-put came back not-covered for 379 third-party servers.
      #
      # leakserver posts the argument it was handed. ping contacts the same
      # host every call carrying nothing it was given. Only the first may be
      # named.
      - name: 'COUNTERFACTUAL: a refused request must still be examined'
        run: |
          python tools/harness.py             declarations/leakserver.declaration.json             captured/leakserver.json             /tmp/leak.report.json             --python python --plan leakserver             --runner container --image saydo/seeded:ci

          python - <<'PY'
          import json, sys
          r = json.load(open('/tmp/leak.report.json'))
          by = {v['id']: v for v in r['verdicts']}
          flow = r.get('dataFlow') or {}
          print('enforcement:', r['enforcement'])
          print('dataFlow   :', json.dumps(flow))
          for v in r['verdicts']:
              print('  {:<12} {:<18} {}'.format(v['verdict'], v['id'],
                                                v.get('evidence','')[:110]))

          problems = []
          egress = by.get('data.stays-put', {})
          if egress.get('verdict') != 'fail':
              problems.append(
                  'data.stays-put came back {!r}. A refused request must still '
                  'have its body examined, or enforcement silently destroys '
                  'the measurement it exists to enable.'
                  .format(egress.get('verdict')))
          elif 'submit' not in (egress.get('evidence') or ''):
              problems.append('the tool that carried the input was not named: '
                              + (egress.get('evidence') or '')[:200])
          if 'ping' in (egress.get('evidence') or ''):
              problems.append('ping was accused of carrying input it never '
                              'received; the counterfactual is not '
                              'discriminating, it is just flagging egress')
          if problems:
              for p in problems:
                  print('::error::' + p)
              sys.exit(1)
          print('OK: refused, examined, and only the input-carrying tool named.')
          PY

      - name: Emit the receipt and check it earns the word "contained"
        run: |
          python tools/receipt.py /tmp/malserver.report.json \
            seeded/malserver.declaration.json captured/malserver.json /tmp/receipts \
            --at 2026-08-29T00:00:00Z
          python - <<'PY'
          import json
          rows = [json.loads(l) for l in open('/tmp/receipts/malserver.receipt.jsonl') if l.strip()]
          mon = next(r for r in rows if r['type'] == 'monitor')
          assert mon['enforcement'] == 'contained', mon['enforcement']
          print('receipt monitor row records enforcement =', mon['enforcement'])
          print(mon['does_not_observe'])
          PY

      - name: Tear down
        if: always()
        run: |
          docker rm -f $(docker ps -aq --filter "name=saydo-proxy") 2>/dev/null || true
          docker network prune -f || true

  # --------------------------------------------------------------------
  # The path a stranger takes: point SayDo at a package nobody wrote a plan
  # for, and have it inspected inside a sandbox built on the spot. If this
  # breaks, the safe route is the hard route, and people will run unknown
  # packages on their laptops instead.
  # --------------------------------------------------------------------
  verify-anything:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet jsonschema cryptography "mcp==1.29.1"
      - run: docker build -f container/Dockerfile.proxy -t saydo/proxy:ci .

      - name: Verify a PyPI package with one command and no prior setup
        run: |
          # No pipe here. `cmd | tee` reports tee's exit status, so a failing
          # verify would be reported as a passing step, which is how a broken
          # path reaches a green check.
          python cli/saydo.py verify --pypi mcp-server-fetch --sandbox \
            --at 2026-08-30T00:00:00Z

      - name: The run must be contained, and must have inspected something
        run: |
          python - <<'PY'
          import json
          r = json.load(open('reports/mcp-server-fetch.report.json'))
          print('enforcement:', r['enforcement'], 'tally:', r['tally'])
          problems = []
          if r['enforcement'] != 'contained':
              problems.append('a --sandbox run was not contained: ' + r['enforcement'])
          # It must have actually served, or the sandbox path proved nothing.
          if not any(v['verdict'] in ('pass', 'fail') for v in r['verdicts']):
              problems.append('nothing was established; the server never acted')
          for p in problems:
              print('::error::' + p)
          raise SystemExit(1 if problems else 0)
          PY

      - name: The receipt must exist and verify
        run: |
          python - <<'PY'
          import glob, hashlib, json, base64
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PublicKey
          anc = sorted(glob.glob('receipts/mcp-*fetch*.anchor.json'))[0]
          a = json.load(open(anc))
          rows = [json.loads(l) for l in open(anc.replace('.anchor.json', '.receipt.jsonl')) if l.strip()]
          canon = lambda r: json.dumps(r, sort_keys=True, ensure_ascii=False, separators=(',', ':'))
          prev = hashlib.sha256(a['genesis'].encode()).hexdigest()
          for i, row in enumerate(rows, 1):
              body = {k: v for k, v in row.items() if k not in ('prev_hash', 'row_hash')}
              assert row['seq'] == i and row['prev_hash'] == prev
              assert row['row_hash'] == hashlib.sha256((prev + canon(body)).encode()).hexdigest()
              prev = row['row_hash']
          assert prev == a['head'], 'head mismatch'
          print('receipt verifies:', len(rows), 'rows, head', a['head'][:16])
          PY

  # --------------------------------------------------------------------
  # The routed topology. It exists to attribute a bare-IP connection from a
  # tool of ANY language - the one case the DNS sink and the Python audit
  # hook both miss. It is only worth having if it buys that WITHOUT giving up
  # containment, so both halves are tested, and the containment half is
  # tested with a NON-Python tool that really tries to reach the internet.
  # --------------------------------------------------------------------
  routed-topology:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build the proxy image
        run: docker build -f container/Dockerfile.proxy -t saydo/proxy:ci .

      - name: Stand up the routed sandbox
        run: |
          # No --internal: the sandbox has a gateway, so packets are really
          # emitted. What stops them is the firewall, installed next.
          docker network create saydo-routed
          docker network create saydo-routed-out
          docker run -d --name saydo-proxy-routed \
            --network saydo-routed --network-alias saydo-proxy \
            saydo/proxy:ci
          docker network connect saydo-routed-out saydo-proxy-routed
          sleep 3
          NET_ID=$(docker network inspect saydo-routed -f '{{.Id}}')
          SUBNET=$(docker network inspect saydo-routed -f '{{(index .IPAM.Config 0).Subnet}}')
          PROXY_IP=$(docker inspect -f '{{(index .NetworkSettings.Networks "saydo-routed").IPAddress}}' saydo-proxy-routed)
          echo "BRIDGE=br-${NET_ID:0:12}" >> $GITHUB_ENV
          echo "SUBNET=$SUBNET" >> $GITHUB_ENV
          echo "PROXY_IP=$PROXY_IP" >> $GITHUB_ENV
          echo "bridge=br-${NET_ID:0:12} subnet=$SUBNET proxy=$PROXY_IP"

      - name: Install containment (LOG then DROP)
        run: |
          # -I prepends, so DROP goes in first and LOG ends up ahead of it:
          # every attempt is recorded before it dies.
          sudo iptables -I DOCKER-USER -i "$BRIDGE" ! -d "$SUBNET" ! -s "$PROXY_IP" -j DROP
          sudo iptables -I DOCKER-USER -i "$BRIDGE" ! -d "$SUBNET" ! -s "$PROXY_IP" \
            -m conntrack --ctstate NEW -j LOG --log-prefix "SAYDO-EGRESS " --log-level 4
          sudo iptables -L DOCKER-USER -n --line-numbers | head -5

      - name: 'CONTAINMENT: a non-Python tool must NOT reach the internet'
        run: |
          set +e
          OUT=$(docker run --rm --network saydo-routed node:22-slim \
            node -e "const s=require('net').connect(80,'93.184.216.34');s.setTimeout(6000);s.on('connect',()=>{console.log('REACHED');process.exit(0)});s.on('error',e=>{console.log('BLOCKED '+e.code)});s.on('timeout',()=>{console.log('BLOCKED timeout')});" 2>&1)
          set -e
          echo "$OUT"
          if echo "$OUT" | grep -q "REACHED"; then
            echo "::error::CONTAINMENT LOST - the routed sandbox reached the internet"
            exit 1
          fi
          echo "OK: still contained."

      - name: 'ATTRIBUTION: that same attempt must have been RECORDED'
        run: |
          sudo dmesg | grep "SAYDO-EGRESS" | tail -5 || true
          if ! sudo dmesg | grep -q "SAYDO-EGRESS.*DST=93.184.216.34"; then
            echo "::error::the bare-IP attempt by a non-Python tool was NOT recorded - the routed topology bought nothing"
            exit 1
          fi
          echo "OK: a non-Python bare-IP attempt was attributed. This is the case the internal topology cannot see."

      - name: Tear down
        if: always()
        run: |
          sudo iptables -D DOCKER-USER -i "$BRIDGE" ! -d "$SUBNET" ! -s "$PROXY_IP" \
            -m conntrack --ctstate NEW -j LOG --log-prefix "SAYDO-EGRESS " --log-level 4 || true
          sudo iptables -D DOCKER-USER -i "$BRIDGE" ! -d "$SUBNET" ! -s "$PROXY_IP" -j DROP || true
          docker rm -f saydo-proxy-routed || true
          docker network rm saydo-routed saydo-routed-out || true
